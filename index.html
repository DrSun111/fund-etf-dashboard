<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>基金ETF专业分析看板</title>
  <meta name="description" content="专业基金与ETF实时分析看板，支持趋势结构、均线分析、成交额异动与资金行为解读。" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #0B1020;
      --panel: rgba(15, 23, 42, 0.92);
      --line: rgba(148, 163, 184, 0.22);
      --text: #F8FAFC;
      --muted: #CBD5E1;
      --gold: #D9A441;
      --blue: #38BDF8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { overflow: hidden; }
    .app { height: 100%; display: grid; grid-template-rows: 64px 1fr; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.96));
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
      min-height: 64px;
      z-index: 2;
    }
    .brand { display: flex; align-items: center; min-width: 0; gap: 10px; }
    .brand img { width: 38px; height: 38px; border-radius: 12px; flex: none; box-shadow: 0 4px 14px rgba(217, 164, 65, 0.18); }
    .title { min-width: 0; }
    .title strong { display: block; font-size: 16px; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .btn {
      border: 1px solid var(--line); color: var(--text); background: rgba(30, 41, 59, 0.82);
      border-radius: 999px; padding: 8px 12px; font-size: 12px; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; min-height: 36px;
    }
    .btn.primary { background: linear-gradient(135deg, #D9A441, #F6D98F); color: #111827; border-color: rgba(255,255,255,0.2); font-weight: 700; }
    .frameWrap { position: relative; min-height: 0; background: #0f172a; }
    iframe { border: 0; width: 100%; height: 100%; background: #0f172a; }
    .fallback {
      position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px;
      background: radial-gradient(circle at 50% 10%, rgba(56,189,248,0.18), transparent 34%), var(--bg);
    }
    .card { max-width: 520px; padding: 24px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: 0 24px 80px rgba(0,0,0,0.35); }
    .card img { width: 86px; height: 86px; border-radius: 24px; margin-bottom: 14px; }
    .card h1 { margin: 0 0 10px; font-size: 22px; }
    .card p { color: var(--muted); line-height: 1.75; margin: 0 0 18px; }
    @media (max-width: 520px) {
      .app { grid-template-rows: 58px 1fr; }
      .topbar { padding-left: 10px; padding-right: 10px; }
      .title strong { font-size: 14px; }
      .title span { display: none; }
      .btn { padding: 7px 10px; font-size: 12px; }
      .brand img { width: 34px; height: 34px; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="./icon-192.png" alt="基金ETF专业分析看板图标" />
        <div class="title">
          <strong>基金ETF专业分析看板</strong>
          <span>趋势结构 · 均线 · 成交额 · 资金行为</span>
        </div>
      </div>
      <nav class="actions">
        <a class="btn" href="https://fund-etf-dashboard.streamlit.app/" target="_blank" rel="noopener">网页打开</a>
        <button class="btn primary" id="reloadBtn" type="button">刷新</button>
      </nav>
    </header>
    <section class="frameWrap">
      <iframe id="streamlitFrame" src="https://fund-etf-dashboard.streamlit.app/?embed=true" title="基金ETF专业分析看板" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
      <div class="fallback" id="fallback">
        <div class="card">
          <img src="./icon-192.png" alt="App Icon" />
          <h1>基金ETF专业分析看板</h1>
          <p>若当前设备限制嵌入显示，请点击下方按钮直接打开在线看板。安装包仍会保留桌面图标和启动入口。</p>
          <a class="btn primary" href="https://fund-etf-dashboard.streamlit.app/" target="_self">进入看板</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    const frame = document.getElementById('streamlitFrame');
    const fallback = document.getElementById('fallback');
    const reloadBtn = document.getElementById('reloadBtn');

    reloadBtn.addEventListener('click', () => {
      frame.src = 'https://fund-etf-dashboard.streamlit.app/?embed=true&t=' + Date.now();
    });

    // If embedding is blocked or too slow, show fallback after 9 seconds.
    let loaded = false;
    frame.addEventListener('load', () => { loaded = true; });
    setTimeout(() => {
      if (!loaded) fallback.style.display = 'grid';
    }, 9000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
